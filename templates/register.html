{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-cover bg-center"
     style="
     background-image:
     linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.55)),
     url('{{ url_for('static', filename='images/register/register.png') }}');
     ">

    <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-xl w-[420px] border border-white/20 text-white">

        <!-- HEADER -->
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='logo.png') }}"
                 class="w-20 mx-auto mb-4">

            <h1 class="text-3xl font-bold">
                Create Account
            </h1>

            <p class="text-gray-300 mt-2">
                Join SolarBill Optimizer ☀️
            </p>
        </div>

        <!-- FORM -->
        <form method="POST" action="/register" id="registerForm">

            <div class="mb-4">
                <label class="block mb-2 text-gray-300 font-medium">
                    Full Name
                </label>

                <input type="text"
                       name="name"
                       id="name"
                       placeholder="Enter your full name"
                       required
                       class="w-full bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-yellow-400 outline-none">
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-gray-300 font-medium">
                    Email Address
                </label>

                <input type="email"
                       name="email"
                       id="email"
                       placeholder="example@gmail.com"
                       required
                       class="w-full bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-yellow-400 outline-none">
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-gray-300 font-medium">
                    Password
                </label>

                <input type="password"
                       name="password"
                       id="password"
                       placeholder="Create password"
                       required
                       class="w-full bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-yellow-400 outline-none">
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-gray-300 font-medium">
                    Confirm Password
                </label>

                <input type="password"
                       id="confirm_password"
                       placeholder="Confirm password"
                       required
                       class="w-full bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-yellow-400 outline-none">
            </div>

            <!-- PASSWORD STRENGTH -->
            <div class="mb-4">
                <div class="w-full bg-white/20 rounded-full h-2">
                    <div id="strengthBar"
                         class="h-2 rounded-full bg-red-500"
                         style="width: 0%">
                    </div>
                </div>

                <p id="strengthText"
                   class="text-sm mt-2 text-gray-300">
                    Password Strength
                </p>
            </div>

            <!-- TERMS -->
            <div class="flex items-center mb-6">
                <input type="checkbox"
                       id="terms"
                       required
                       class="mr-2">

                <label class="text-sm text-gray-300">
                    I agree to the
                    <span class="text-yellow-400 font-semibold">
                        Terms & Conditions
                    </span>
                </label>
            </div>

            <button type="submit"
                    class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-semibold p-3 rounded-xl transition">
                🌱 Create Account
            </button>

        </form>

        <!-- LOGIN LINK -->
        <p class="text-center mt-6 text-gray-300">
            Already have an account?
            <a href="/login"
               class="text-yellow-400 font-semibold">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
