{% extends "base.html" %}

{% block content %}

<!-- FULL BACKGROUND -->
<div class="min-h-screen flex items-center justify-center bg-cover bg-center"
     style="
     background-image:
     linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.55)),
     url('{{ url_for('static', filename='images/login image/login.png') }}');
     ">

    <!-- GLASS CONTAINER -->
    <div class="bg-white/10 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 text-white">

        <!-- LOGO -->
        <div class="text-center mb-4">
            <div class="text-5xl">️ </div>
            <h1 class="text-3xl font-bold mt-2">
                Solar Login
            </h1>
            <p class="text-gray-300 text-sm">
                Power your savings with solar energy
            </p>
        </div>

        <!-- LOGIN FORM -->
        <form method="POST">

            <!-- STEP CONTROL -->
            <input type="hidden"
                   name="step"
                   value="{{ 'otp' if show_otp else 'login' }}">

            <!-- EMAIL -->
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                value="{{ email or '' }}"
                class="w-full p-3 bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-lg mb-3 focus:ring-2 focus:ring-yellow-400 outline-none"
                required>

            {% if not show_otp %}

            <!-- PASSWORD -->
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                class="w-full p-3 bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-yellow-400 outline-none"
                required>

                <div class="flex justify-end mt-2">

    <a
        href="{{ url_for('forgot_password') }}"
        class="text-sm text-white-600 hover:underline">

        Forgot Password?

    </a>

</div>

            <!-- GENERATE OTP -->
            <button
                type="submit"
                name="step"
                value="login"
                class="w-full bg-yellow-400 hover:bg-yellow-500 text-black p-3 rounded-lg font-semibold transition">
                Generate OTP
            </button>

            {% else %}

            <!-- HIDDEN PASSWORD -->
            <input type="hidden"
                   name="password"
                   value="{{ password }}">

            <!-- OTP BOX -->
            <div class="mt-5 bg-white/10 border border-white/20 p-4 rounded-xl">

                <p class="text-sm text-gray-300 mb-2">
                    📩 OTP sent to <b>{{ email }}</b>
                </p>

                <!-- OTP INPUT -->
                <input
                    type="text"
                    name="otp"
                    maxlength="6"
                    placeholder="Enter OTP"
                    class="w-full p-3 bg-white/20 border border-white/30 text-white placeholder-gray-300 rounded-lg text-center text-lg mb-3 focus:ring-2 focus:ring-green-400 outline-none"
                    required>

                <!-- VERIFY OTP -->
                <button
                    type="submit"
                    name="step"
                    value="otp"
                    class="w-full bg-green-500 hover:bg-green-600 text-white p-3 rounded-lg font-semibold transition">
                    ✅ Verify & Login
                </button>

            </div>

            {% endif %}

        </form>

        <!-- FOOTER -->
        <p class="text-center mt-6 text-gray-300 text-sm">
            Don't have an account?
            <a href="/register" class="text-yellow-400 font-semibold">Register</a>
        </p>

        <a href="/" class="block text-center mt-2 text-gray-400 text-xs">
            ← Back to Home
        </a>

    </div>

</div>

{% endblock %}
